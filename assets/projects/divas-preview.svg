  <text x="66" y="277" text-anchor="middle" fill="#e01f79" font-family="monospace" font-size="10" font-weight="600">Next.js</text>

  <rect x="112" y="262" width="80" height="22" rx="11" fill="#0f0320" stroke="#a51fc4" stroke-width="1" stroke-opacity="0.5"/>
