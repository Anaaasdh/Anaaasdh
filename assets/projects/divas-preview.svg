  <rect x="546" y="148" width="6" height="32" rx="2" fill="#e01f79"/>
  <rect x="555" y="163" width="6" height="17" rx="2" fill="#6f3cc4"/>
  <rect x="564" y="152" width="6" height="28" rx="2" fill="#a51fc4"/>
  <rect x="573" y="159" width="6" height="21" rx="2" fill="#e01f79"/>
  <rect x="582" y="147" width="6" height="33" rx="2" fill="#6f3cc4"/>
  <rect x="591" y="155" width="6" height="25" rx="2" fill="#e01f79"/>
  <rect x="600" y="162" width="6" height="18" rx="2" fill="#a51fc4"/>
  <rect x="609" y="150" width="6" height="30" rx="2" fill="#e01f79"/>
  <rect x="618" y="157" width="6" height="23" rx="2" fill="#6f3cc4"/>
