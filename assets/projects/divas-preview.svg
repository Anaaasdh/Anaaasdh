<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto">
  <defs>
    <linearGradient id="divas_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0612"/>
      <stop offset="50%" stop-color="#100818"/>
      <stop offset="100%" stop-color="#080309"/>
    </linearGradient>
    <linearGradient id="divas_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e01f79"/>
      <stop offset="50%" stop-color="#bd1362"/>
      <stop offset="100%" stop-color="#a51fc4"/>
    </linearGradient>
    <linearGradient id="divas_gem_a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe3ee"/>
      <stop offset="45%" stop-color="#de589b"/>
      <stop offset="100%" stop-color="#e01f79"/>
    </linearGradient>
    <linearGradient id="divas_gem_b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e01f79"/>
      <stop offset="55%" stop-color="#a51fc4"/>
      <stop offset="100%" stop-color="#6f3cc4"/>
    </linearGradient>
    <linearGradient id="divas_bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e01f79" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e01f79" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a51fc4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6f3cc4" stop-opacity="0"/>
    </linearGradient>
    <filter id="divas_glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="divas_sofglow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="divas_grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e01f79" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="8" fill="url(#divas_bg)"/>
  <rect width="800" height="360" rx="8" fill="url(#divas_grid)"/>

  <!-- Subtle radial glow behind gem -->
  <ellipse cx="90" cy="185" rx="100" ry="80" fill="#e01f79" fill-opacity="0.06"/>
  <ellipse cx="90" cy="185" rx="60" ry="40" fill="#a51fc4" fill-opacity="0.08"/>

  <!-- Window title bar -->
  <rect x="0" y="0" width="800" height="38" rx="8" fill="#0a0510"/>
  <rect x="0" y="28" width="800" height="10" fill="#0a0510"/>
  <circle cx="25" cy="19" r="6" fill="#ef4444"/>
  <circle cx="45" cy="19" r="6" fill="#eab308"/>
  <circle cx="65" cy="19" r="6" fill="#10b981"/>
  <text x="400" y="24" text-anchor="middle" fill="#6b21a8" font-family="monospace" font-size="11" letter-spacing="2">DIVAS PLATFORM // NEXT.JS + DISCORD API // NODE: PRODUCTION</text>

  <!-- Border frame -->
  <rect x="0" y="0" width="800" height="360" rx="8" fill="none" stroke="#2a0a1e" stroke-width="1.5"/>
  <rect x="0" y="0" width="800" height="360" rx="8" fill="none" stroke="#e01f79" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Gem Logo: Crown -->
  <path d="M 62 130 L 73 143 L 90 122 L 107 143 L 118 130 L 114 148 L 66 148 Z" fill="url(#divas_accent)" opacity="0.9" filter="url(#divas_sofglow)"/>
