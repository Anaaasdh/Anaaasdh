  <text x="334" y="277" text-anchor="middle" fill="#e01f79" font-family="monospace" font-size="10" font-weight="600">Discord.js v14</text>

  <rect x="394" y="262" width="80" height="22" rx="11" fill="#0f0320" stroke="#a51fc4" stroke-width="1" stroke-opacity="0.4"/>
  <text x="434" y="277" text-anchor="middle" fill="#a51fc4" font-family="monospace" font-size="10" font-weight="600">Lavalink</text>

  <rect x="484" y="262" width="80" height="22" rx="11" fill="#0f0320" stroke="#6f3cc4" stroke-width="1" stroke-opacity="0.4"/>
  <text x="524" y="277" text-anchor="middle" fill="#9a72dd" font-family="monospace" font-size="10" font-weight="600">YouTube API</text>

