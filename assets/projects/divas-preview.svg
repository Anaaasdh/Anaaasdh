  <text x="325" y="176" text-anchor="middle" fill="#a51fc4" font-family="monospace" font-size="10">Live Analytics</text>

  <rect x="390" y="162" width="120" height="20" rx="10" fill="#1e0a2e" stroke="#6f3cc4" stroke-width="0.75"/>
